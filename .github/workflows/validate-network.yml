name: Validate network Bicep

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/validate-network.yml', '.github/workflows/deploy-network.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/validate-network.yml', '.github/workflows/deploy-network.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and lint (no Azure login or deployment)
        run: |
          az bicep install --version v0.43.8
          az bicep build --file infra/main.bicep --outfile /tmp/network.json
          az bicep build --file infra/bootstrap/network-identity.bicep --outfile /tmp/network-identity.json
          az bicep build-params --file infra/parameters/dev.bicepparam --outfile /tmp/network.parameters.json
          az bicep build-params --file infra/parameters/foundation.bicepparam --outfile /tmp/foundation.parameters.json
          az bicep build-params --file infra/parameters/vpn-poc.bicepparam --outfile /tmp/vpn.parameters.json
          python3 infra/scripts/check_network_plan.py template /tmp/network.json
          python3 -m unittest discover -s infra/scripts -p 'test_*.py'
